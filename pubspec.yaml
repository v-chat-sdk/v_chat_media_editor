name: v_chat_media_editor
description: A cross-platform media preview and image editing package for the V Chat SDK.
version: 3.0.1
homepage: https://v-chat-sdk.github.io/vchat-v2-docs/docs/intro
issue_tracker: https://github.com/v-chat-sdk/v_chat_media_editor/issues
repository: https://github.com/v-chat-sdk/v_chat_media_editor
topics:
  - chat
  - media
  - image-editor
  - video

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_painter: ^2.1.0
  cached_network_image: ^3.4.1
  chewie: ^1.15.0
  fc_native_video_thumbnail: ^3.0.1
  flutter_cache_manager: ^3.4.2
  flutter_image_compress: ^2.5.1
  image_cropper: ^12.2.1
  path: ^1.9.1
  path_provider: ^2.1.6
  v_platform: ^2.2.0
  video_player: ^2.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

platforms:
  android:
  ios:
  linux:
  web:
  windows:
  macos:
